name: Feature request / suggestion
description: Suggest an improvement to the stack or the docs
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like added or changed, and why is it useful?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Anything you tried or ruled out?
  - type: checkboxes
    id: scope
    attributes:
      label: Keeps the core design?
      options:
        - label: This keeps the single `/data` mount (working hardlinks) intact
